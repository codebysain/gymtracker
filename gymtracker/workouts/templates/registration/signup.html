<div style="max-width: 600px; margin: 40px auto; font-family: Arial; background:#f5f7fa; padding:20px; border-radius:12px;">

<h1 style="text-align:center;">Sign Up</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Register</button>
</form>

<a href="{% url 'login' %}">Already have an account? Login</a>

</div>
