<div style="max-width: 600px; margin: 40px auto; font-family: Arial; background:#f5f7fa; padding:20px; border-radius:12px;">

<h1 style="text-align:center;">Login</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Login</button>
</form>

<p style="margin-top:10px;">
  Not registered?
  <a href="{% url 'signup' %}">Sign Up</a>
</p>

</div>
